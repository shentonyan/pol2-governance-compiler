name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Repository passes G04 (no holdout content)
        run: python -m gates.g04_holdout .
      - name: Pilot data passes G02
        run: python -m gates.g02_family_split data/pilot/pilot.jsonl
      - name: A degenerate candidate must fail G06
        run: |
          python -m baselines.constant --policy always_block --inputs data/pilot/pilot.jsonl --out build/always_block.jsonl
          set +e
          python -m gates.g06_floor --cases data/pilot/pilot.jsonl --predictions build/always_block.jsonl > /dev/null
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected G06 exit code 1 (fail), got $code"; exit 1; fi
